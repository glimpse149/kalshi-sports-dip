name: live

on:
  schedule:
    # NBA backup: GitHub often starts scheduled runs hours late, so fire hourly ~4pm-10pm ET.
    # (cron-job.org starts NBA at 6:30pm and college football at 11:30am, on time.)
    - cron: "7 21,22,23 * * *"
    - cron: "7 0,1,2,3 * * *"
  workflow_dispatch:
    inputs:
      sport:
        description: "nba or ncaaf"
        required: false
        default: "nba"

permissions:
  contents: write
  actions: write            # lets a run start the next one when games outlast 6 hours

concurrency:
  group: live-${{ inputs.sport || 'nba' }}
  cancel-in-progress: false

env:
  SPORT: ${{ inputs.sport || 'nba' }}

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main               # queued runs must start from the latest saved state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Watch games (paper only)
        id: run
        env:
          UPDATES_TELEGRAM_BOT_TOKEN: ${{ secrets.UPDATES_TELEGRAM_BOT_TOKEN }}
          UPDATES_TELEGRAM_CHAT_ID: ${{ secrets.UPDATES_TELEGRAM_CHAT_ID }}
        run: python -m bot live "$SPORT"
      - name: Save state
        if: always()
        run: |
          git config user.name "dip-bot"
          git config user.email "dip-bot@users.noreply.github.com"
          git add state data
          git diff --cached --quiet && exit 0
          git commit -m "live run $SPORT $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((RANDOM % 10 + 5)); done
          exit 1
      - name: Keep going (games still on)
        if: steps.run.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST repos/${{ github.repository }}/actions/workflows/live.yml/dispatches -f ref=main -f "inputs[sport]=$SPORT"
