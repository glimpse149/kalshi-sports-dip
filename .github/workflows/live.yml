name: live (NBA games)

on:
  schedule:
    # GitHub often starts scheduled runs hours late, so fire hourly from ~4pm to ~10pm ET.
    # Only one run is active at a time (concurrency below); extra ones queue, start when the
    # previous run ends, and exit within a minute once the night's games are final.
    - cron: "7 21,22,23 * * *"
    - cron: "7 0,1,2,3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main               # queued runs must start from the latest saved state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Watch games (paper only)
        env:
          UPDATES_TELEGRAM_BOT_TOKEN: ${{ secrets.UPDATES_TELEGRAM_BOT_TOKEN }}
          UPDATES_TELEGRAM_CHAT_ID: ${{ secrets.UPDATES_TELEGRAM_CHAT_ID }}
        run: python -m bot live
      - name: Save state
        if: always()
        run: |
          git config user.name "dip-bot"
          git config user.email "dip-bot@users.noreply.github.com"
          git add state data
          git diff --cached --quiet || (git commit -m "live run $(date -u +%F)" && git pull --rebase && git push)
