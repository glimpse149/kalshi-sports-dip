name: live (NBA games)

on:
  schedule:
    - cron: "37 23 * * *"     # ~6:37pm ET (7:37pm during daylight time); runs up to ~6h
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Watch games (paper only)
        env:
          UPDATES_TELEGRAM_BOT_TOKEN: ${{ secrets.UPDATES_TELEGRAM_BOT_TOKEN }}
          UPDATES_TELEGRAM_CHAT_ID: ${{ secrets.UPDATES_TELEGRAM_CHAT_ID }}
        run: python -m bot live
      - name: Save state
        if: always()
        run: |
          git config user.name "dip-bot"
          git config user.email "dip-bot@users.noreply.github.com"
          git add state data
          git diff --cached --quiet || (git commit -m "live run $(date -u +%F)" && git pull --rebase && git push)
