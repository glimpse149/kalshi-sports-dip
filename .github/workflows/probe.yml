name: probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q -r requirements.txt
      - run: |
          python3 - <<'PY'
          from datetime import date, datetime
          from bot import espn, kalshi
          for g in espn.fetch_games(date(2026,11,12)):
              ts=int(datetime.fromisoformat(g["start"].replace("Z","+00:00")).timestamp())
              teams=list(g["teams"])
              ev=f"KXNBAGAME-26NOV12{teams[1]}{teams[0]}"
              out={}
              for t in teams:
                  for e in (f"KXNBAGAME-26NOV12{teams[0]}{teams[1]}", f"KXNBAGAME-26NOV12{teams[1]}{teams[0]}"):
                      try:
                          out[t]=kalshi.pregame_mid(f"{e}-{t}", ts); break
                      except Exception as x: out[t]=str(x)[:40]
              print(g["start"], out)
          PY
