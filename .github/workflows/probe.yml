name: probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q -r requirements.txt
      - run: |
          python3 - <<'PY'
          from datetime import date
          import requests
          from bot import espn, kalshi
          from bot.sports import SPORTS, scoreboard_url
          sp = SPORTS["ncaaf"]; s = requests.Session()
          mk = kalshi.fetch_markets(s, series=sp["series"])
          d = date(2026,11,21)
          games = espn.fetch_games(d, s, url=scoreboard_url(sp), params=sp["params"])
          ev = {}
          for m in mk:
              if m["date"] == d: ev.setdefault(m["event"], []).append(m)
          by = {}
          for e, ms in ev.items():
              g = espn.match_event(ms, games)
              if g: by.setdefault(g["id"], []).append((e, [(m["team"], m["team_name"], espn.team_code_in_game(m, g)) for m in ms], {c: t["names"] for c, t in g["teams"].items()}))
          for gid, lst in by.items():
              if len(lst) > 1:
                  for x in lst: print("DUP", gid, x)
          PY
