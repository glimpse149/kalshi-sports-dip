name: probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import requests, json
          K="https://api.elections.kalshi.com/trade-api/v2"
          r=requests.get(f"{K}/series",params={"category":"Sports"},timeout=30).json()
          ss=[s["ticker"] for s in r.get("series",[]) if s["ticker"].endswith("GAME") or "GAME" in s["ticker"]]
          print("GAME series:",len(ss),sorted(ss)[:200])
          for t in ["KXNFLGAME","KXNCAAFGAME","KXNHLGAME","KXNCAAMBGAME","KXEPLGAME","KXMLSGAME","KXUCLGAME","KXWNBAGAME","KXNCAAFBGAME"]:
            js=requests.get(f"{K}/markets",params={"series_ticker":t,"status":"settled","limit":6},timeout=30).json()
            ms=js.get("markets",[])
            print(t,len(ms),[(m["ticker"],m.get("yes_sub_title"),m.get("result"),m.get("volume")) for m in ms[:6]])
          E="https://site.api.espn.com/apis/site/v2/sports"
          for path,d in [("football/nfl","20261109"),("football/college-football","20261108"),("hockey/nhl","20261114"),("basketball/mens-college-basketball","20261114"),("soccer/eng.1","20261108")]:
            js=requests.get(f"{E}/{path}/scoreboard",params={"dates":d},timeout=30).json()
            evs=js.get("events",[])
            print(path,len(evs),[(e["id"],e["shortName"],[c["team"]["abbreviation"] for c in e["competitions"][0]["competitors"]]) for e in evs[:4]])
            if evs:
              s=requests.get(f"{E}/{path}/summary",params={"event":evs[0]["id"]},timeout=30).json()
              pl=s.get("plays") or []
              if not pl and s.get("drives"):
                pl=[p for dr in s["drives"].get("previous",[]) for p in dr.get("plays",[])]
              print("   plays",len(pl),"keys",sorted(pl[0].keys())[:30] if pl else None)
              if pl: print("   sample",{k:pl[0].get(k) for k in ("wallclock","period","clock")}, {k:pl[-1].get(k) for k in ("wallclock","period")})
              print("   other keys", [k for k in s.keys()][:25])
          PY
