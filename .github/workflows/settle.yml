name: settle + daily summary

on:
  schedule:
    - cron: "13 8 * * *"      # ~3:13am ET (GitHub often runs this hours late): settle + summary
    - cron: "13 13 * * *"     # backup ~8:13am ET; sends again only if something new settled
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Settle and summarize
        env:
          UPDATES_TELEGRAM_BOT_TOKEN: ${{ secrets.UPDATES_TELEGRAM_BOT_TOKEN }}
          UPDATES_TELEGRAM_CHAT_ID: ${{ secrets.UPDATES_TELEGRAM_CHAT_ID }}
        run: python -m bot settle
      - name: Save state
        if: always()
        run: |
          git config user.name "dip-bot"
          git config user.email "dip-bot@users.noreply.github.com"
          git add state data
          git diff --cached --quiet || (git commit -m "settle $(date -u +%F)" && git pull --rebase && git push)
