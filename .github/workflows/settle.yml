name: settle + daily summary

on:
  schedule:
    # main trigger: cron-job.org at 7:00am ET. Backup only (GitHub may run it late);
    # it sends a second summary only if it settles something new.
    - cron: "13 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: bot-state
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Settle and summarize
        env:
          UPDATES_TELEGRAM_BOT_TOKEN: ${{ secrets.UPDATES_TELEGRAM_BOT_TOKEN }}
          UPDATES_TELEGRAM_CHAT_ID: ${{ secrets.UPDATES_TELEGRAM_CHAT_ID }}
        run: python -m bot settle
      - name: Save state
        if: always()
        run: |
          git config user.name "dip-bot"
          git config user.email "dip-bot@users.noreply.github.com"
          git add state data
          git diff --cached --quiet && exit 0
          git commit -m "settle $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase && git push && exit 0; sleep $((RANDOM % 10 + 5)); done
          exit 1
